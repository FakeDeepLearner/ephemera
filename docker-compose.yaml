services:
  postgres:
    image: postgres:latest
    container_name: ephemera-postgres
    environment:
      POSTGRES_DB: ephemera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    depends_on:
        postgres:
          condition: service_healthy
    ports:
      - "8000:8000"

  redis:
    image: redis:latest
    container_name: ephemera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

