services:
  postgres:
    restart: unless-stopped
    image: postgres:latest
    container_name: ephemera-postgres
    environment:
      POSTGRES_DB: ephemera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 3

  silo:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    container_name: silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: silo-admin
      MINIO_ROOT_PASSWORD: silo-password
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: silo-admin
      AWS_SECRET_ACCESS_KEY: silo-password

    volumes:
      - silo-data:/data
    healthcheck:
      test: [ "CMD", "silo", "healthcheck", "ready" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    container_name: ephemera-mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ephemera-backend
    restart: unless-stopped
    env_file:
      - .env.local
    depends_on:
        postgres:
          condition: service_healthy
        mailpit:
           condition: service_started
        redis:
          condition: service_started
        silo:
          condition: service_healthy
    ports:
      - "8000:8000"
    # This ensures that any updates made to the code
    # are immediately reflected in the container, and vice versa.
    volumes:
      - ./backend:/ephemera

  redis:
    image: redis:latest
    container_name: ephemera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
    postgres_data:
    mailpit-data:
    redis_data:
    silo-data: